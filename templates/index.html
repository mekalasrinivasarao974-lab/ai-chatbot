<!DOCTYPE html>
<html>
<head>
    <title>My AI Chatbot</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 0;
        }

        .chatbox {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
        }

        input {
            width: 75%;
            padding: 12px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="chatbox">
    <h1>🤖 My AI Chatbot</h1>

    <div id="messages"></div>

    <input id="message" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {

    const input = document.getElementById("message");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (!text) return;

    messages.innerHTML += "<p><b>You:</b> " + text + "</p>";

    input.value = "";

    const response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: text
        })
    });

    const data = await response.json();

    messages.innerHTML += "<p><b>AI:</b> " + data.reply + "</p>";

    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
